<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <title>Çevrimdışı — Ecozyon Tech</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        text-align: center;
        padding: 24px;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0b1220; color: #f1f5f9; }
      }
      .card { max-width: 420px; }
      .mark { width: 64px; height: 64px; margin: 0 auto 20px; display: block; }
      h1 { font-size: 22px; letter-spacing: -0.02em; margin: 0 0 8px; }
      p { font-size: 14.5px; line-height: 1.6; color: #64748b; margin: 0 0 24px; }
      a {
        display: inline-block;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        color: #fff;
        padding: 12px 24px;
        border-radius: 999px;
        background: linear-gradient(120deg, #0ea5e9 0%, #10b981 100%);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="mark" viewBox="0 0 512 512" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#0EA5E9" />
            <stop offset="1" stop-color="#10B981" />
          </linearGradient>
        </defs>
        <rect width="512" height="512" rx="112" fill="#0b1220" />
        <g fill="none" stroke="url(#g)" stroke-width="18">
          <circle cx="256" cy="256" r="168" />
          <path d="M128 256 Q256 128 384 256 T128 256" />
        </g>
        <circle cx="352" cy="176" r="26" fill="#10B981" />
      </svg>
      <h1>Çevrimdışısın</h1>
      <p>İnternet bağlantın yok gibi görünüyor. Bağlantın geri geldiğinde tekrar dene.</p>
      <a href="/">Yeniden dene</a>
    </div>
  </body>
</html>
