<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.2" r="0.55">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.15" cy="0.95" r="0.5">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- subtle dot grid -->
  <g fill="#0F172A" opacity="0.05">
    <circle cx="60" cy="60" r="1.5"/>
    <circle cx="60" cy="570" r="1.5"/>
    <circle cx="1140" cy="60" r="1.5"/>
    <circle cx="1140" cy="570" r="1.5"/>
  </g>

  <!-- decorative ring (echoes the WorldGlobe rim) -->
  <g transform="translate(950 480)">
    <circle r="190" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.35"/>
    <circle r="150" fill="none" stroke="#0EA5E9" stroke-width="1" opacity="0.25"/>
    <circle r="105" fill="none" stroke="#10B981" stroke-width="1" opacity="0.3"/>
    <circle r="60" fill="url(#accent)" opacity="0.18"/>
    <circle cx="0" cy="-150" r="4" fill="#10B981"/>
    <circle cx="106" cy="106" r="4" fill="#0EA5E9"/>
    <circle cx="-130" cy="60" r="3" fill="#0EA5E9"/>
    <circle cx="60" cy="170" r="3" fill="#10B981"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(80 110)">
    <circle cx="22" cy="22" r="22" fill="url(#accent)"/>
    <path d="M14 22 L20 28 L32 16" stroke="white" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="30" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="700" font-size="28" fill="#0F172A" letter-spacing="-0.5">Ecozyon Tech</text>
  </g>

  <!-- headline -->
  <text x="80" y="310" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="700" font-size="72" fill="#0F172A" letter-spacing="-2">
    AI ile sürdürülebilirlik,
  </text>
  <text x="80" y="392" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="700" font-size="72" fill="url(#accent)" letter-spacing="-2">
    ölçülebilir alışkanlık.
  </text>

  <!-- subline -->
  <text x="80" y="448" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="22" fill="#475569" letter-spacing="-0.3">
    Giyilebilir teknoloji · Yapay zeka analitiği · Topluluk
  </text>

  <!-- bottom row -->
  <g transform="translate(80 545)">
    <rect x="0" y="0" width="6" height="22" rx="3" fill="url(#accent)"/>
    <text x="18" y="17" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="15" fill="#0F172A" letter-spacing="0.5">
      ECOZYON.TECH
    </text>
    <text x="190" y="17" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="14" fill="#64748B">
      React 19 · Vite 8 · Three.js · Vercel
    </text>
  </g>
</svg>
