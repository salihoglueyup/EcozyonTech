<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/assets/logo/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1220" />

    <!-- PWA: installable web app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/logo/logo.jpg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ecozyon" />

    <!-- Self-hosted fonts (see @font-face in src/index.css). Preload the latin
         base of each family — the rest (latin-ext) loads via unicode-range. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- No-JS fallback: <Reveal> ships prerendered content at opacity:0 and
         only un-hides it via a client effect. Without JS those sections would
         stay invisible, so force them visible for no-script clients/crawlers. -->
    <noscript>
      <style>
        [data-reveal] { opacity: 1 !important; transform: none !important; }
      </style>
    </noscript>

    <!-- Default head; the prerender step replaces this per route. -->
    <title>Ecozyon Tech — AI ile sürdürülebilirlik</title>
    <meta
      name="description"
      content="Ecozyon Tech, giyilebilir teknolojiler ve akıllı AI ile bireysel ve kurumsal sürdürülebilirliği ölçülebilir, pratik alışkanlıklara dönüştürür."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ecozyon Tech" />
    <meta property="og:image" content="https://ecozyon.tech/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:image" content="https://ecozyon.tech/og.png" />
    <link rel="alternate" type="application/rss+xml" title="Ecozyon Tech — Blog" href="/feed.xml" />
    <!--ssr-head-->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Ecozyon Tech",
        "url": "https://ecozyon.tech",
        "email": "hello@ecozyon.tech",
        "description": "AI + sustainability + wearables.",
        "sameAs": [
          "https://ecozyon.tech"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"><!--ssr-outlet--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
